<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 420" role="img" aria-labelledby="title desc">
  <title id="title">Deal X Stocks</title>
  <desc id="desc">Deal X Stocks default brand logo</desc>
  <defs>
